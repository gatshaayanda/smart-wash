name: Deploy Smart Wash Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-wash-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase service account availability
        id: credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firestore rules were not deployed: repository secret FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
            echo "## Firestore rules deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret `FIREBASE_SERVICE_ACCOUNT_JSON` is missing. The rules in the repository have not been published to Firebase." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global firebase-tools

      - name: Verify target project and service account
        if: steps.credentials.outputs.available == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          PROJECT_ID="$(node -p "require('./.firebaserc').projects.default")"
          ACCOUNT_PROJECT_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));process.stdout.write(a.project_id||'')")"
          test "$PROJECT_ID" = "exquisite-waterproof-services"
          test "$ACCOUNT_PROJECT_ID" = "$PROJECT_ID"
          echo "Verified Smart Wash Firebase project: $PROJECT_ID"

      - name: Deploy Firestore rules
        if: steps.credentials.outputs.available == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          PROJECT_ID="$(node -p "require('./.firebaserc').projects.default")"
          firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive

      - name: Remove Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
