name: Smart Wash booking reminders

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-wash-booking-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Smart Wash reminder endpoint
        env:
          SMART_WASH_REMINDER_CRON_SECRET: ${{ secrets.SMART_WASH_REMINDER_CRON_SECRET }}
          SMART_WASH_PUBLIC_URL: ${{ vars.SMART_WASH_PUBLIC_URL }}
        run: |
          test -n "$SMART_WASH_REMINDER_CRON_SECRET"
          test -n "$SMART_WASH_PUBLIC_URL"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $SMART_WASH_REMINDER_CRON_SECRET" \
            "$SMART_WASH_PUBLIC_URL/api/notifications/reminders"
